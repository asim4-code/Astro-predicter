<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astro Scalping Predictor</title>
  <style>
    body {
      background-color: #0d1b2a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background-color: #1b263b;
      padding: 20px;
      border-radius: 10px;
    }
    h1 {
      text-align: center;
      color: #e0e1dd;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
    }
    button {
      background-color: #415a77;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .report {
      margin-top: 20px;
      background-color: #0d1b2a;
      padding: 15px;
      border-radius: 8px;
    }
    .report p {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Astro Predictor</h1>
    <label for="coin">Enter Coin Name:</label>
    <input type="text" id="coin" placeholder="e.g., BTC" />
    <button onclick="getPrediction()">Predict</button>
    <div class="report" id="report"></div>
  </div>

  <script>
    async function getPrediction() {
      const coin = document.getElementById("coin").value;
      const response = await fetch(`http://127.0.0.1:5000/predict?coin=${coin}`);
      const data = await response.json();
      const report = document.getElementById("report");
      if (data.predictions) {
        report.innerHTML = `<h3>${data.coin} Predictions</h3>` + data.predictions.map(p => `<p>${p.time}: ${p.planet1}, ${p.planet2} → <b>${p.direction}</b></p>`).join("");
      } else {
        report.innerHTML = `<p>Error: ${data.error}</p>`;
      }
    }
  </script>
</body>
</html>
